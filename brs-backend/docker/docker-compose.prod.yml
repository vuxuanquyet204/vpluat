# ============================================================
# BRS Production Stack
# Bao gồm: PostgreSQL, Redis, Backend (Spring Boot), Frontend (Next.js), Nginx
# Lưu ý: RabbitMQ đã được loại bỏ (config-only, không có consumer/producer code)
# ============================================================

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: brs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brs}
      POSTGRES_USER: ${DB_USER:-brs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brs_user} -d ${DB_NAME:-brs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Redis Cache (đang được sử dụng: OTP, refresh-token, lockout, view-count, cache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: brs-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Backend (Spring Boot)
  # ============================================================
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: brs-backend:latest
    container_name: brs-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-brs}
      DB_USER: ${DB_USER:-brs_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      UPLOAD_DIR: /app/uploads
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN_1: ${CORS_ORIGIN_1:-https://${DOMAIN}}
      CORS_ORIGIN_2: ${CORS_ORIGIN_2:-https://www.${DOMAIN}}
      CORS_ORIGIN_3: ${CORS_ORIGIN_3:-https://admin.${DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./keys/jwt-private.pem:/app/keys/jwt-private.pem:ro
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # Frontend (Next.js standalone)
  # ============================================================
  frontend:
    build:
      context: ../../frontend/vp-luat
      dockerfile: Dockerfile
    image: brs-frontend:latest
    container_name: brs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.${DOMAIN}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: brs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
  nginx_cache:

networks:
  brs-internal:
    driver: bridge